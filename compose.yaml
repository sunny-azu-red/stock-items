# Pitbox for Docker Compose or a Portainer stack (see docs/deployment.md).
#
# Settings come from the environment: in Portainer, the stack's
# "Environment variables"; with `docker compose`, a .env file next to this one.
# DB_HOST and DB_PASSWORD are required; the rest have defaults.
name: pitbox
services:
  pitbox:
    # latest is the newest release (a v* tag), never master; pin a version
    # (e.g. PITBOX_TAG=1.2) to stay on it, or use edge to follow master.
    image: ghcr.io/sunny-azu-red/pitbox:${PITBOX_TAG:-latest}
    container_name: pitbox
    restart: unless-stopped
    # Hardening: the app writes nothing to its own filesystem (everything
    # lives in Postgres), so the root filesystem is read-only. Uploads larger
    # than the in-memory limit and vips' work files go to /tmp, a tmpfs.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PITBOX_PORT:-8080}:8080"
    environment:
      DB_HOST: ${DB_HOST:?set DB_HOST to the Postgres server's LAN address}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-stock_items}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      APP_CURRENCY: ${APP_CURRENCY:-EUR}
      APP_SKU_SEARCH_URL: ${APP_SKU_SEARCH_URL:-https://www.google.com/search?q={q}}
      APP_SKU_SEARCH_PREFIX: ${APP_SKU_SEARCH_PREFIX:-}
      # The names and IPs Pitbox is opened by, comma-separated, e.g.
      # pitbox.lan,192.168.1.5: other names are refused (DNS rebinding).
      # Unset, it answers to any.
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-}
      # When "today" starts for reminders, date checks and spending. Unset,
      # the app uses the Docker host's zone (from the mount below).
      TZ: ${TZ:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
