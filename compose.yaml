# Pitbox for Docker Compose or a Portainer stack (see docs/deployment.md).
#
# Settings come from the environment: in Portainer, the stack's
# "Environment variables"; with `docker compose`, a .env file next to this one.
# DB_HOST and DB_PASSWORD are required; the rest have defaults.
name: pitbox
services:
  pitbox:
    image: ghcr.io/sunny-azu-red/pitbox:${PITBOX_TAG:-latest}
    container_name: pitbox
    restart: unless-stopped
    ports:
      - "${PITBOX_PORT:-8080}:8080"
    environment:
      DB_HOST: ${DB_HOST:?set DB_HOST to the Postgres server's LAN address}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-stock_items}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      APP_CURRENCY: ${APP_CURRENCY:-EUR}
      APP_SKU_SEARCH_URL: ${APP_SKU_SEARCH_URL:-https://www.google.com/search?q=}
      APP_SKU_SEARCH_PREFIX: ${APP_SKU_SEARCH_PREFIX:-}
      # When "today" starts for reminders, date checks and spending. Unset,
      # the app uses the Docker host's zone (from the mount below).
      TZ: ${TZ:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
