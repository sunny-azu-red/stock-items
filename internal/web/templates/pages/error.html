{{/* The page header (layout.html writes it from these). */}}
{{define "head-title"}}{{.Data.Title}}{{end}}
{{define "head-line"}}<span>Error {{.Data.Code}}</span>{{end}}
{{define "content"}}{{with .Data}}
<div class="card">
  <div class="empty">
    {{icon "triangle-alert"}}
    <p>{{.Message}}</p>
    <a class="btn" href="/">{{icon "arrow-left"}} Back to the dashboard</a>
  </div>
</div>
{{end}}{{end}}
