{{define "content"}}{{with .Data}}
<div class="page-head">
  <div class="page-title">
    <h1>{{.Title}}</h1>
    <p class="sub">Error {{.Code}}</p>
  </div>
</div>
<div class="card">
  <div class="empty">
    {{icon "triangle-alert"}}
    <p>{{.Message}}</p>
    <a class="btn" href="/">{{icon "arrow-left"}} Back to the dashboard</a>
  </div>
</div>
{{end}}{{end}}
